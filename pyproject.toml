[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-orchestrator"
version = "0.22.0"
description = "Evidence-oriented agent orchestration kernel, local development milestone"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi==0.159.1", "pydantic==2.14.1", "uvicorn==0.54.0", "nats-py==2.16.0", "cryptography==50.0.2", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.1.1"]
integration = ["psycopg[binary]==3.3.6"]

[project.scripts]
loom = "loom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loom = ["web/*.html", "web/*.css", "web/*.js", "resources/software-dev/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
