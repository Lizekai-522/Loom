[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-orchestrator"
version = "0.1.0"
description = "Evidence-oriented agent orchestration kernel, local development milestone"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi==0.159.1", "pydantic==2.14.1", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["httpx==0.28.1", "pytest==9.1.1"]

[project.scripts]
loom = "loom.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

