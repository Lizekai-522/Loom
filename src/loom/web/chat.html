<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Verilo · 编程会话</title>
  <link rel="icon" href="/console/assets/verilo-icon.svg?v=4" type="image/svg+xml">
  <link rel="icon" href="/console/assets/verilo-taskbar-v4.ico?v=4" sizes="any">
  <link rel="stylesheet" href="/console/assets/chat.css">
  <link rel="stylesheet" href="/console/assets/verilo-theme.css">
  <link rel="stylesheet" href="/console/assets/frame.css">
  <link rel="stylesheet" href="/console/assets/harness-chrome.css">
  <script src="/console/assets/frame.js" defer></script>
  <script src="/console/assets/chat.js" defer></script>
  <link rel="stylesheet" href="/console/assets/vendor-xterm.css">
  <link rel="stylesheet" href="/console/assets/workspace-ui.css">
  <script src="/console/assets/vendor-xterm.js" defer></script>
  <script src="/console/assets/vendor-xterm-fit.js" defer></script>
  <script src="/console/assets/workspace-ui.js" defer></script>
  <script src="/console/assets/harness-ui.js" defer></script>
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar verilo-sidebar" id="sidebar" aria-label="会话">
      <div class="side-top">
        <a class="brand" href="/console"><img src="/console/assets/verilo-mark.svg" alt=""><span>Verilo</span></a>
        <button id="close-sidebar" class="icon-button only-mobile" type="button" aria-label="收起侧栏">×</button>
      </div>
      <button id="new-session" class="new-session" type="button">＋ <span>新建会话</span></button>
      <nav class="app-nav session-nav" aria-label="工作区">
        <a href="/console"><span aria-hidden="true">◯</span>对话</a>
        <a href="/console/tasks"><span aria-hidden="true">□</span>任务</a>
        <a href="/console/projects"><span aria-hidden="true">▱</span>项目</a>
        <a href="/console/automations"><span aria-hidden="true">◷</span>自动化</a>
        <a href="/console/market"><span aria-hidden="true">⊞</span>插件市场</a>
        <a href="/console/sessions" aria-current="page"><span aria-hidden="true">▣</span>编程会话</a>
      </nav>
      <nav class="session-list" id="session-list" aria-label="历史会话"></nav>
      <div class="side-foot verilo-sidebar-footer">
        <div class="verilo-account">
          <button type="button" id="account-trigger" class="verilo-account-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu" aria-label="账号菜单">
            <span class="verilo-avatar" id="account-avatar" aria-hidden="true"></span>
            <span class="verilo-account-name" id="account-name"></span>
          </button>
          <div id="account-menu" class="verilo-account-menu" role="menu" hidden>
            <a id="account-usage" class="verilo-account-usage" role="menuitem" href="/console/settings#usage" hidden>
              <span class="verilo-account-usage-top"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 12 16 8"/></svg><span id="account-usage-title">今日预算</span><span id="account-usage-meta"></span></span>
              <span class="verilo-account-usage-bar" aria-hidden="true"><span id="account-usage-fill"></span></span>
            </a>
            <div class="verilo-account-sep" id="account-usage-sep" hidden></div>
            <a role="menuitem" href="/console/settings">设置</a>
            <a role="menuitem" href="/console/settings#appearance">外观</a>
            <a role="menuitem" href="/console/settings#general">账号</a>
            <a role="menuitem" href="/console/expert">项目空间</a>
            <a role="menuitem" href="/console/settings#guide">引导</a>
            <div class="verilo-account-sep" id="account-signout-sep" hidden></div>
            <button type="button" role="menuitem" id="account-signout" class="verilo-account-danger" hidden>退出登录</button>
          </div>
        </div>
        <button type="button" id="collapse-sidebar" class="verilo-icon" aria-label="折叠侧栏">⟨</button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>
    <main class="main" id="main">
      <header class="main-head">
        <button id="open-sidebar" class="icon-button only-mobile" type="button" aria-label="打开会话列表">☰</button>
        <div class="head-title"><h1 id="session-title">新会话</h1><span id="session-state" class="state" hidden></span></div>
        <div class="head-actions">
          <button id="pause" class="ghost" type="button" hidden>暂停</button>
          <button id="continue" class="ghost" type="button" hidden>继续</button>
          <button id="toggle-details" class="ghost" type="button" hidden aria-expanded="false" aria-controls="details">详情</button>
        </div>
      </header>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <section class="stream" id="stream" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="examples" id="examples"></div>
        </div>
        <div id="conversation" hidden></div>
      <div class="examples-box" id="examples-box" hidden>
        <label for="examples-input">验收样例</label>
        <textarea id="examples-input" rows="3" maxlength="20000" spellcheck="false" aria-label="验收样例"></textarea>
      </div>
      <div id="attachments" class="chat-attachments" hidden aria-label="已添加的文件"></div>
      <input id="file-input" type="file" multiple hidden accept=".txt,.md,.csv,.json,.jsonl,.py,.js,.ts,.tsx,.jsx,.html,.css,.yaml,.yml,.xml,.log,.sh,.ps1,.toml,.ini,.c,.h,.cpp,.hpp,.java,.go,.rs,.sql,.rb,.php,.swift,.kt,.vue,.svelte,.scala,.cs,.bat">
      <form class="composer" id="composer">
        <button id="attach" class="ghost" type="button" aria-label="添加文本或代码文件">＋</button>
        <button id="toggle-examples" class="ghost examples-toggle" type="button" aria-expanded="false" aria-controls="examples-box">＋ 样例</button>
        <label class="sr-only" for="prompt">描述你的需求</label>
        <textarea id="prompt" rows="1" maxlength="4000" aria-label="需求" autocomplete="off"></textarea>
        <button id="send" class="send" type="submit" aria-label="发送"><span class="send-label">发送</span>↑</button>
      </form>
      </section>
    </main>
    <aside class="details" id="details" hidden aria-label="运行详情">
      <div class="details-head"><h2>运行详情</h2><button id="close-details" class="icon-button" type="button" aria-label="关闭详情">×</button></div>
      <div id="details-body"></div>
    </aside>
  </div>
</body>
</html>
