<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Verilo · 设置</title>
  <link rel="icon" href="/console/assets/verilo-icon.svg?v=4" type="image/svg+xml">
  <link rel="icon" href="/console/assets/verilo-taskbar-v4.ico?v=4" sizes="any">
  <link rel="stylesheet" href="/console/assets/chat.css">
  <link rel="stylesheet" href="/console/assets/settings.css">
  <link rel="stylesheet" href="/console/assets/verilo-theme.css">
  <link rel="stylesheet" href="/console/assets/harness-chrome.css">
</head>
<body class="admin-app">
  <aside class="admin-side" aria-label="管理导航">
    <a class="brand" href="/console"><img src="/console/assets/verilo-mark.svg" alt="">Verilo</a>
    <nav>
      <a href="/console">对话</a>
      <a href="#section-overview">就绪度</a>
      <a href="#section-model">模型与密钥</a>
      <a href="#section-search">联网搜索</a>
      <a href="#section-mail">域名邮箱</a>
      <a href="#section-verification">独立复核</a>
      <a href="#section-sandbox">沙箱镜像</a>
      <a href="#section-hosttests">宿主用例</a>
      <a href="#section-quotas">持久配额</a>
      <a href="#section-members">成员与访问</a>
      <a href="#section-executor">执行器</a>
      <a href="/console/settings">返回设置</a>
    </nav>
  </aside>
  <main class="settings-main admin-main">
    <div id="notice" class="notice" hidden></div>
    <div id="restart-banner" class="restart-banner" hidden>
      <span id="restart-banner-text">执行器配置已更新，需要重启后生效。</span>
      <button id="restart-now" class="primary" type="button">重启执行器</button>
    </div>
    <section class="settings-section" id="section-overview">
      <h1>就绪度总览</h1>
      <div id="overview-cards" class="cards"></div>
    </section>
    <section class="settings-section" id="section-model">
      <h2>模型与密钥</h2>
      <div id="model-body"></div>
    </section>
    <section class="settings-section" id="section-search">
      <h2>联网搜索</h2>
      <div id="search-body"></div>
    </section>
    <section class="settings-section" id="section-mail">
      <h2>域名邮箱</h2>
      <div id="mail-body"></div>
    </section>
    <section class="settings-section" id="section-verification">
      <h2>独立双模型复核</h2>
      <div id="verification-body"></div>
    </section>
    <section class="settings-section" id="section-sandbox">
      <h2>沙箱镜像</h2>
      <div id="sandbox-body"></div>
    </section>
    <section class="settings-section" id="section-hosttests">
      <h2>宿主用例（冻结终验）</h2>
      <div id="hosttests-body"></div>
    </section>
    <section class="settings-section" id="section-quotas">
      <h2>持久配额</h2>
      <div id="quotas-body"></div>
    </section>
    <section class="settings-section" id="section-members">
      <h2>成员与访问</h2>
      <div id="members-body"></div>
    </section>
    <section class="settings-section" id="section-executor">
      <h2>执行器</h2>
      <div id="executor-body"></div>
    </section>
  </main>
  <script src="/console/assets/settings.js"></script>
</body>
</html>
