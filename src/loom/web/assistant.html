<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Verilo</title>
  <link rel="icon" href="/console/assets/verilo-icon.svg?v=4" type="image/svg+xml">
  <link rel="icon" href="/console/assets/verilo-taskbar-v4.ico?v=4" sizes="any">
  <link rel="stylesheet" href="/console/assets/chat.css">
  <link rel="stylesheet" href="/console/assets/assistant.css">
  <link rel="stylesheet" href="/console/assets/verilo-theme.css">
  <script src="/console/assets/assistant.js" defer></script>
  <link rel="stylesheet" href="/console/assets/vendor-xterm.css">
  <link rel="stylesheet" href="/console/assets/workspace-ui.css">
  <script src="/console/assets/vendor-xterm.js" defer></script>
  <script src="/console/assets/vendor-xterm-fit.js" defer></script>
  <script src="/console/assets/workspace-ui.js" defer></script>
  <script src="/console/assets/workbench.js" defer></script>
  <script src="/console/assets/harness-ui.js" defer></script>
</head>
<body>
  <div class="as-shell" id="shell">
    <aside class="verilo-sidebar" aria-label="导航">
      <a class="verilo-brand" href="/console"><img src="/console/assets/verilo-mark.svg" alt=""><span>VERILO</span></a>
      <a class="verilo-new" href="/console/sessions">＋ <span>新建任务</span></a>
      <label class="verilo-search"><input id="task-search" type="search" aria-label="搜索任务或文件"></label>
      <button type="button" id="open-skills" class="verilo-nav-button">技能</button>
      <div id="session-rail" aria-label="任务"></div>
      <nav class="verilo-nav" aria-label="工作区">
        <a href="/console" aria-current="page"><span aria-hidden="true">◯</span>对话</a>
        <button type="button" data-open-tab="active"><span aria-hidden="true">□</span>任务</button>
        <a href="/console/projects"><span aria-hidden="true">▱</span>项目</a>
        <a href="/console/automations"><span aria-hidden="true">◷</span>自动化</a>
        <a href="/console/market"><span aria-hidden="true">⊞</span>插件市场</a>
        <button type="button" data-open-tab="mail" id="nav-mail" hidden><span aria-hidden="true">✉</span>邮件</button>
      </nav>
      <div class="verilo-sidebar-footer">
        <div class="verilo-account">
          <button type="button" id="account-trigger" class="verilo-account-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu" aria-label="账号菜单">
            <span class="verilo-avatar" id="account-avatar" aria-hidden="true"></span>
            <span class="verilo-account-name" id="account-name"></span>
          </button>
          <div id="account-menu" class="verilo-account-menu" role="menu" hidden>
            <a id="account-usage" class="verilo-account-usage" role="menuitem" href="/console/settings#usage" hidden>
              <span class="verilo-account-usage-top">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 12 16 8"/></svg>
                <span id="account-usage-title">今日预算</span>
                <span id="account-usage-meta"></span>
              </span>
              <span class="verilo-account-usage-bar" aria-hidden="true"><span id="account-usage-fill"></span></span>
            </a>
            <div class="verilo-account-sep" id="account-usage-sep" hidden></div>
            <a role="menuitem" href="/console/settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="10" cy="17" r="1.6"/></svg>设置</a>
            <a role="menuitem" href="/console/settings#appearance"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z"/></svg>外观</a>
            <a role="menuitem" href="/console/settings#general"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.4-3 3.6-4.5 7-4.5s5.6 1.5 7 4.5"/></svg>账号</a>
            <a role="menuitem" href="/console/settings#guide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5"/><path d="M19 5 10 14"/><path d="M8 6H6v12h12v-2"/></svg>引导</a>
            <div class="verilo-account-sep" id="account-signout-sep" hidden></div>
            <button type="button" role="menuitem" id="account-signout" class="verilo-account-danger" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 7V5H5v14h5v-2"/><path d="M10 12h9"/><path d="M16 8l4 4-4 4"/></svg>退出登录</button>
          </div>
        </div>
        <button type="button" id="collapse-sidebar" class="verilo-icon" aria-label="折叠侧栏">⟨</button>
      </div>
    </aside>
    <main class="as-main">
      <header class="as-head">
        <a class="brand mobile-brand" href="/console"><img src="/console/assets/verilo-mark.svg" alt="">Verilo</a>
        <div class="head-title"><strong>对话</strong></div>
        <div class="as-status" id="status"><span class="dot" id="status-dot"></span><span id="status-text">在线</span></div>
        <span id="route-badge" class="as-pill" hidden></span>
        <nav class="as-links">
          <button id="open-inspector" class="ghost" type="button" aria-expanded="false" aria-controls="inspector">检查器</button>
          <button id="open-settings" class="ghost" type="button" aria-expanded="false" aria-controls="settings-drawer">设置</button>
          <a class="settings-link" href="/console/settings">全部设置</a>
          <button id="toggle-panel" class="ghost" type="button" aria-expanded="false" aria-controls="panel">任务<span id="badge" class="as-badge" hidden></span></button>
          <span id="who" class="as-who" hidden></span>
          <button id="logout" class="ghost" type="button" hidden>退出</button>
        </nav>
      </header>
      <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
      <section class="as-stream" id="stream" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="bento" id="bento" aria-label="当前工作"></div>
        </div>
        <div id="messages"></div>
      </section>
      <div class="as-attachments" id="attachments" aria-label="待发送文件" hidden></div>
      <form class="composer as-composer" id="composer">
        <input id="file-input" type="file" accept=".txt,.md,.csv,.json,.jsonl,.py,.js,.ts,.tsx,.jsx,.html,.css,.yaml,.yml,.xml,.log,.sh,.ps1,.toml,.ini,.c,.h,.cpp,.hpp,.java,.go,.rs,.sql,.rb,.php,.swift,.kt,.vue,.svelte,.scala,.cs,.bat" multiple hidden>
        <button id="attach" class="ghost as-attach" type="button" aria-label="添加文本或代码文件">＋</button>
        <textarea id="prompt" rows="1" maxlength="8000" aria-label="消息"></textarea>
        <button id="interrupt" type="button" hidden>打断</button>
        <button id="send" type="submit" class="primary">发送</button>
      </form>
      <section id="settings-drawer" class="inspector" hidden aria-label="设置">
        <div class="as-tabs" role="tablist">
          <button type="button" data-settings="agent" aria-selected="true">Agent</button>
          <button type="button" data-settings="runtime" aria-selected="false">Runtime</button>
        </div>
        <div id="settings-drawer-body"></div>
      </section>
    </main>
    <aside id="rightbar" class="rightbar" hidden>
      <div id="inspector-resize" class="inspector-resize" role="separator" aria-orientation="vertical" aria-label="调整检查器宽度" tabindex="0" aria-valuemin="280" aria-valuemax="840" aria-valuenow="420"></div>
      <section id="inspector" class="inspector" hidden aria-label="检查器">
        <div class="as-tabs inspector-tabs" role="tablist" aria-label="检查器">
          <span class="inspector-tab" data-inspector-tab="files" hidden><button type="button" role="tab" data-inspector="files" aria-selected="false">文件</button><button type="button" class="inspector-tab-close" data-close-inspector="files" aria-label="关闭文件">×</button></span>
          <span class="inspector-tab" data-inspector-tab="diff" hidden><button type="button" role="tab" data-inspector="diff" aria-selected="false">差异</button><button type="button" class="inspector-tab-close" data-close-inspector="diff" aria-label="关闭差异">×</button></span>
          <span class="inspector-tab" data-inspector-tab="browser" hidden><button type="button" role="tab" data-inspector="browser" aria-selected="false">浏览器</button><button type="button" class="inspector-tab-close" data-close-inspector="browser" aria-label="关闭浏览器">×</button></span>
          <span class="inspector-tab" data-inspector-tab="computer" hidden><button type="button" role="tab" data-inspector="computer" aria-selected="false">电脑</button><button type="button" class="inspector-tab-close" data-close-inspector="computer" aria-label="关闭电脑">×</button></span>
          <span class="inspector-tab" data-inspector-tab="dag" hidden><button type="button" role="tab" data-inspector="dag" aria-selected="false">流程</button><button type="button" class="inspector-tab-close" data-close-inspector="dag" aria-label="关闭流程">×</button></span>
        </div>
        <div id="inspector-body"></div>
      </section>
    <aside class="as-panel" id="panel" aria-label="任务与待办" hidden>
      <div class="verilo-panel-head">
        <strong>任务</strong>
        <div class="verilo-panel-actions">
          <button id="panel-narrow" type="button" aria-label="缩窄任务面板">−</button>
          <button id="panel-widen" type="button" aria-label="加宽任务面板">＋</button>
          <button id="close-panel" type="button" aria-label="关闭任务面板">×</button>
        </div>
      </div>
      <div class="as-tabs" role="tablist">
        <button role="tab" data-tab="active" aria-selected="true">进行中</button>
        <button role="tab" data-tab="approvals" aria-selected="false">待批准<span class="as-count" id="count-approvals"></span></button>
        <button role="tab" data-tab="results" aria-selected="false">成果</button>
        <button role="tab" data-tab="todos" aria-selected="false">待办</button>
        <button role="tab" data-tab="mail" aria-selected="false" id="tab-mail" hidden>邮件</button>
        <button role="tab" data-tab="settings" aria-selected="false">授权</button>
      </div>
      <div class="as-tab-body" id="tab-body"></div>
    </aside>
    </aside>
    <div id="command-palette" class="command-palette" hidden role="dialog" aria-label="命令">
      <input id="command-palette-input" aria-label="命令" autocomplete="off">
      <div id="command-palette-list"></div>
    </div>
  </div>
</body>
</html>
